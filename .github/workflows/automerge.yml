name: Label-Based Auto Merge & Self-Disable

on:
  schedule:
    # Trigger at 01:50 UTC (04:50 MSK) daily
    - cron: '50 1 * * *'
  workflow_dispatch:

jobs:
  merge-by-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      actions: write

    steps:
      - name: Search and Merge PRs with Label and Permissions
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL_NAME = 'auto-merge';
            // Define allowed roles (e.g., 'OWNER', 'COLLABORATOR', 'MEMBER')
            const ALLOWED_ROLES = ['OWNER', 'COLLABORATOR']; 

            try {
              // 1. Fetch all open pull requests
              const { data: pullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                sort: 'created',
                direction: 'asc'
              });

              // Filter PRs by label AND author's permission level
              const targetPRs = pullRequests.filter(pr => {
                const hasLabel = pr.labels.some(label => label.name === LABEL_NAME);
                const hasPermission = ALLOWED_ROLES.includes(pr.author_association);
                
                if (hasLabel && !hasPermission) {
                  console.log(`Skipping PR #${pr.number}: Author "${pr.user.login}" (${pr.author_association}) does not have required permissions.`);
                }
                
                return hasLabel && hasPermission;
              });

              if (targetPRs.length === 0) {
                console.log(`No authorized PRs found with label: "${LABEL_NAME}".`);
              } else {
                for (const pr of targetPRs) {
                  console.log(`Merging authorized PR #${pr.number} from ${pr.user.login}...`);
                  
                  // 2. Execute the merge
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    merge_method: 'merge'
                  });
                  
                  console.log(`Successfully merged PR #${pr.number}.`);
                }
              }

              // 3. Self-Disable to save Actions quota
              await github.rest.actions.disableWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'label-auto-merge.yml'
              });
              console.log("Workflow has been automatically disabled.");

            } catch (error) {
              console.error(`An error occurred: ${error.message}`);
            }